<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Pop-in animation for intro text */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Fade-out for intro overlay */
        #intro-container.hidden {
            opacity: 0 !important;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Optional: style skip button hover */
        #skip-btn:hover {
            background: rgba(255,255,255,1);
        }
    </style>
</head>

<body>
<!-- BEGIN INTRO VIDEO + TEXT ANIMATION -->
<div id="intro-container" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
">
    <!-- Correct video path with spaces encoded -->
    <video id="intro-video" src="YASH%20AMARSELA%20PRESENTS.mp4" autoplay muted playsinline style="
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
    "></video>

    <!-- Animated Text -->
    <div id="introAnimation" style="
        color: white;
        font-size: 60px;
        font-weight: bold;
        text-align: center;
        z-index: 10001;
        opacity: 0;
        animation: popIn 1s forwards;
    ">BIG YASH AMARSELA PRESENTS</div>

    <!-- Skip Button -->
    <button id="skip-btn" style="
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10002;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: rgba(255,255,255,0.8);
        border: none;
        border-radius: 5px;
    ">Skip Intro</button>
</div>

<script>
    const video = document.getElementById('intro-video');
    const container = document.getElementById('intro-container');
    const skipBtn = document.getElementById('skip-btn');

    function hideIntro() {
        container.classList.add('hidden');
        video.pause();
    }

    // Hide video when it ends
    video.addEventListener('ended', hideIntro);

    // Skip button functionality
    skipBtn.addEventListener('click', hideIntro);
</script>
<!-- END INTRO VIDEO + TEXT ANIMATION -->

<!-- QUIZ CONTENT STARTS -->
<h1>Simple Quiz</h1>

<div id="quiz">
    <div id="quiz-container">
        <p id="question"></p>

        <button onclick="checkAnswer('A')" id="A"></button>
        <button onclick="checkAnswer('B')" id="B"></button>
        <button onclick="checkAnswer('C')" id="C"></button>
        <button onclick="checkAnswer('D')" id="D"></button>

        <!-- Developer name -->
        <p id="developer">Developed by Yash Amarsela</p>
    </div>
</div>

<p id="score"></p>

<script src="script.js"></script>
<!-- QUIZ CONTENT ENDS -->

</body>
</html>
