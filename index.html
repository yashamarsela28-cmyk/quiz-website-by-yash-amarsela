<!DOCTYPE html>
<html>
<head>
<title>Quiz App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<!-- BEGIN INTRO VIDEO -->
<div id="intro-container" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
">
  <video id="intro-video" src="assets/videos/intro.mp4" autoplay muted playsinline style="
      width: 100%;
      height: 100%;
      object-fit: cover;
  "></video>
  
  <!-- Skip Button -->
  <button id="skip-btn" style="
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10000;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: rgba(255,255,255,0.8);
      border: none;
      border-radius: 5px;
  ">Skip Intro</button>
</div>

<script>
  const video = document.getElementById('intro-video');
  const container = document.getElementById('intro-container');
  const skipBtn = document.getElementById('skip-btn');

  // Hide video when it ends
  video.addEventListener('ended', () => {
    container.style.display = 'none';
  });

  // Skip button functionality
  skipBtn.addEventListener('click', () => {
    container.style.display = 'none';
    video.pause();
  });
</script>
<!-- END INTRO VIDEO -->
<!-- Animation Overlay -->
<div id="introAnimation">BIG YASH AMARSELA PRESENTS</div>

<h1>Simple Quiz</h1>

<div id="quiz">
  <div id="quiz-container">

    <p id="question"></p>

    <button onclick="checkAnswer('A')" id="A"></button>
    <button onclick="checkAnswer('B')" id="B"></button>
    <button onclick="checkAnswer('C')" id="C"></button>
    <button onclick="checkAnswer('D')" id="D"></button>

    <!-- Developer name -->
    <p id="developer">Developed by Yash Amarsela</p>

  </div>
</div>

<p id="score"></p>

<script src="script.js"></script>

</body>
</html>
