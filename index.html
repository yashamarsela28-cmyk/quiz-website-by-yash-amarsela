<!DOCTYPE html>
<html>
<head>
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Simple Quiz</h1>

  <div id="quiz-container">
    <p id="question"></p>
    <button onclick="checkAnswer('A')" id="A"></button>
    <button onclick="checkAnswer('B')" id="B"></button>
    <button onclick="checkAnswer('C')" id="C"></button>
    <button onclick="checkAnswer('D')" id="D"></button>

    <!-- Developer name stays visible for all questions -->
    <p id="developer">Developed by Yash Amarsela</p>
  </div>

  <p id="score"></p>

  <script src="script.js"></script>
</body>
